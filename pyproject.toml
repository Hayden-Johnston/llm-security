[project]
name = "llm-security"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hayden-Johnston" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
llm-security = "llm_security:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
